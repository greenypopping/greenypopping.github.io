<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy New Year 2026</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@200;300;400;500&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0f;
            font-family: 'Montserrat', sans-serif;
            position: relative;
            padding: 20px;
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        #welcomeCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
        }

        .gradient-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(120, 80, 200, 0.18) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(255, 180, 50, 0.12) 0%, transparent 50%);
            z-index: 1;
            pointer-events: none;
        }

        .card-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 650px;
            max-height: calc(100vh - 40px);
            max-height: calc(100dvh - 40px);
            display: flex;
            align-items: center;
        }

        .card {
            border-radius: clamp(20px, 3vw, 32px);
            padding: clamp(25px, 4vh, 55px) clamp(20px, 4vw, 50px);
            text-align: center;
            position: relative;
            overflow: visible;
            /* Allows 3D elements to float out */
            width: 100%;
            transform-style: preserve-3d;
            /* Enable 3D children */
            -webkit-user-select: none;
            /* Safari */
            user-select: none;
            /* Prevent text selection */
        }

        .name-input {
            -webkit-user-select: text;
            user-select: text;
        }

        .card-glass {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: inherit;
            overflow: hidden;
            /* CLIPS the light beam */
            z-index: 0;
            transform: translateZ(0);
            /* Base layer */

            background: linear-gradient(165deg,
                    rgba(255, 255, 255, 0.03) 0%,
                    rgba(255, 255, 255, 0.005) 50%,
                    rgba(0, 0, 0, 0.02) 100%);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow:
                0 50px 100px rgba(0, 0, 0, 0.6),
                0 0 150px rgba(120, 80, 200, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* 3D Depth Layers - Ensure Z-index is higher than glass */
        /* Using animation-composition: add to combine translateZ (static) with translateY (animation) */
        .card-icon {
            transform: translateZ(60px);
            position: relative;
            z-index: 10;
            animation: element-reveal 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s backwards;
            animation-composition: add;
        }

        .year {
            transform: translateZ(50px);
            position: relative;
            z-index: 10;
            animation: element-reveal 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s backwards;
            animation-composition: add;
        }

        .recipient-name {
            transform: translateZ(45px);
            position: relative;
            z-index: 10;
            animation: element-reveal 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.4s backwards;
            animation-composition: add;
        }

        .subtitle {
            transform: translateZ(40px);
            position: relative;
            z-index: 10;
            animation: element-reveal 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.45s backwards;
            animation-composition: add;
        }

        .message {
            transform: translateZ(35px);
            position: relative;
            z-index: 10;
            animation: element-reveal 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s backwards;
            animation-composition: add;
        }

        .wishes {
            transform: translateZ(30px);
            position: relative;
            z-index: 10;
            animation: element-reveal 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.6s backwards;
            animation-composition: add;
        }

        .divider {
            transform: translateZ(30px);
            position: relative;
            z-index: 10;
            animation: element-reveal 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.55s backwards;
            animation-composition: add;
        }

        .signature {
            transform: translateZ(25px);
            position: relative;
            z-index: 10;
            animation: element-reveal 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.7s backwards;
            animation-composition: add;
        }

        .type-buttons,
        .input-container {
            transform: translateZ(40px);
            position: relative;
            z-index: 10;
            animation: element-reveal 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.75s backwards;
            animation-composition: add;
        }

        .btn-container {
            transform: translateZ(30px);
            position: relative;
            z-index: 10;
            animation: element-reveal 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.8s backwards;
            animation-composition: add;
        }

        .card-wrapper {
            animation: card-enter 1s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
        }

        @keyframes card-enter {
            0% {
                opacity: 0;
                transform: scale(0.9) translateY(30px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes element-reveal {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-glass::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg,
                    #ffd700, #ff6b35, #ff1493, #8b5cf6, #06b6d4, #ffd700);
            background-size: 400% 400%;
            border-radius: inherit;
            z-index: -1;
            animation: borderGlow 8s linear infinite;
            opacity: 0.4;
        }

        @keyframes borderGlow {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .light-beam {
            position: absolute;
            top: -50%;
            left: 50%;
            width: 250px;
            height: 400px;
            background: linear-gradient(180deg, rgba(255, 215, 0, 0.06) 0%, transparent 100%);
            transform: translateX(-50%) rotate(15deg);
            pointer-events: none;
            animation: beamMove 10s ease-in-out infinite;
        }

        @keyframes beamMove {

            0%,
            100% {
                transform: translateX(-50%) rotate(15deg);
                opacity: 0.4;
            }

            50% {
                transform: translateX(-50%) rotate(-15deg);
                opacity: 0.6;
            }
        }

        .card-icon {
            font-size: clamp(2rem, 4vh, 3.5rem);
            margin-bottom: clamp(10px, 1.5vh, 20px);
            display: block;
            filter: drop-shadow(0 0 15px rgba(255, 100, 150, 0.4));
            cursor: pointer;
            transition: transform 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            outline: none;
        }

        .card-icon:active {
            transform: scale(0.9);
        }

        @keyframes spin-pop {
            0% {
                transform: scale(1) rotate(0deg);
            }

            50% {
                transform: scale(1.3) rotate(180deg);
            }

            100% {
                transform: scale(1) rotate(360deg);
            }
        }

        .icon-animate {
            animation: spin-pop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.2rem, 3vw, 2.4rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.95);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: clamp(5px, 1vh, 12px);
        }

        .year {
            font-size: clamp(3rem, 10vw, 7rem);
            font-weight: 200;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.15em;
            background: linear-gradient(180deg, #ffffff 0%, #ffd700 40%, #ff8c00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: clamp(10px, 2vh, 25px);
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(10px, 2vw, 20px);
            margin: clamp(12px, 2vh, 25px) 0;
        }

        .divider-line {
            width: clamp(50px, 10vw, 100px);
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.6), transparent);
        }

        .divider-diamond {
            width: clamp(6px, 1vw, 10px);
            height: clamp(6px, 1vw, 10px);
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            transform: rotate(45deg);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        /* Creator Section */
        .creator-section {
            margin-bottom: clamp(12px, 2vh, 25px);
        }

        .section-label {
            font-size: clamp(0.6rem, 1.2vw, 0.8rem);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: clamp(8px, 1.5vh, 14px);
            display: block;
        }

        .type-buttons {
            display: flex;
            gap: clamp(8px, 1.5vw, 15px);
            justify-content: center;
            flex-wrap: wrap;
        }

        .type-btn {
            padding: clamp(10px, 1.5vh, 16px) clamp(14px, 2vw, 28px);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.75);
            font-size: clamp(0.75rem, 1.3vw, 1rem);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
        }

        .type-btn:hover {
            border-color: rgba(255, 215, 0, 0.5);
            color: #ffd700;
        }

        .type-btn.active {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 140, 0, 0.12));
            border-color: #ffd700;
            color: #ffd700;
        }

        .type-btn .icon {
            margin-right: 8px;
        }

        .input-container {
            margin: clamp(12px, 2vh, 20px) 0;
        }

        .name-input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: clamp(12px, 1.8vh, 18px) clamp(18px, 3vw, 30px);
            font-size: clamp(0.9rem, 1.5vw, 1.2rem);
            color: #fff;
            text-align: center;
            width: 100%;
            max-width: 350px;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
        }

        .name-input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .name-input:focus {
            border-color: rgba(255, 215, 0, 0.5);
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1);
        }

        /* Message */
        .recipient-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.3rem, 3vw, 2rem);
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: clamp(8px, 1.5vh, 16px);
        }

        .recipient-name .name-highlight {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 500;
        }

        .message {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1rem, 2vw, 1.5rem);
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.7;
            margin: clamp(10px, 1.5vh, 20px) auto;
            font-style: italic;
            width: 100%;
            text-align: center;
        }

        .wishes {
            font-size: clamp(0.75rem, 1.3vw, 0.95rem);
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.8;
            font-weight: 300;
            margin: clamp(10px, 1.5vh, 20px) auto 0;
            width: 100%;
            text-align: center;
        }

        .signature {
            margin-top: clamp(15px, 2.5vh, 30px);
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1rem, 1.8vw, 1.3rem);
            color: rgba(255, 255, 255, 0.6);
        }

        .signature .from-name {
            color: #ffd700;
            font-weight: 500;
        }

        /* Buttons */
        .btn-container {
            margin-top: clamp(15px, 2.5vh, 30px);
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .share-btn {
            padding: clamp(12px, 1.8vh, 18px) clamp(25px, 4vw, 45px);
            background: transparent;
            border: 1px solid rgba(255, 215, 0, 0.5);
            border-radius: 8px;
            color: #ffd700;
            font-size: clamp(0.7rem, 1.2vw, 0.9rem);
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .share-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            transition: left 0.3s ease;
            z-index: -1;
        }

        .share-btn:hover,
        .share-btn:active {
            color: #0a0a0f;
            border-color: #ffd700;
        }

        .share-btn:hover::before,
        .share-btn:active::before {
            left: 0;
        }

        .footer {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.15);
            z-index: 10;
        }

        /* View/Creator mode */
        .view-mode .creator-section,
        .view-mode .input-container,
        .view-mode .btn-container {
            display: none;
        }

        .view-mode .signature {
            display: block;
        }

        .creator-mode .signature {
            display: none;
        }

        /* Mobile adjustments */
        @media (max-height: 600px) {
            body {
                padding: 12px;
            }

            .divider {
                margin: 8px 0;
            }

            .message {
                margin: 8px 0;
            }
        }

        @media (max-width: 400px) {
            .type-btn .icon {
                display: none;
            }

            .type-btn {
                padding: 10px 16px;
            }
        }
    </style>
</head>

<body>
    <canvas id="particleCanvas"></canvas>
    <canvas id="welcomeCanvas"></canvas>
    <div class="gradient-overlay"></div>

    <div class="card-wrapper">
        <div class="card" id="card">
            <div class="card-glass">
                <div class="light-beam"></div>
            </div>

            <span class="card-icon" id="cardIcon">💕</span>
            <div class="subtitle">Happy New Year</div>
            <div class="year">2026</div>

            <div class="divider">
                <div class="divider-line"></div>
                <div class="divider-diamond"></div>
                <div class="divider-line"></div>
            </div>

            <div class="creator-section">
                <label class="section-label">Choose Card Type</label>
                <div class="type-buttons">
                    <button class="type-btn" data-type="0">
                        <span class="icon">✨</span>General
                    </button>
                    <button class="type-btn active" data-type="1">
                        <span class="icon">💕</span>My Love
                    </button>
                    <button class="type-btn" data-type="2">
                        <span class="icon">🌟</span>Friend
                    </button>
                    <button class="type-btn" data-type="3">
                        <span class="icon">👨‍👩‍👧‍👦</span>Family
                    </button>
                </div>
            </div>

            <div class="input-container">
                <input type="text" class="name-input" id="nameInput" placeholder="Enter their name" maxlength="20">
            </div>

            <div class="recipient-name" id="recipientName">To my dearest love</div>
            <div class="message" id="cardMessage">"Every moment with you is a blessing. Here's to another year of love."
            </div>
            <p class="wishes" id="cardWishes">May this year bring us closer together and fill our lives with beautiful
                memories.</p>

            <div class="signature"><span id="signatureText">With all my love,</span> <span class="from-name"
                    id="fromName">♥</span></div>

            <div class="btn-container">
                <button class="share-btn" onclick="generateLink()">Generate Link</button>
                <button class="share-btn" onclick="copyLink()" id="copyBtn" style="display:none;">Copy Link</button>
            </div>
        </div>
    </div>

    <div class="footer">by Avi-Codes</div>
