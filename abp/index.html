<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream App</title>
    
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }

        /* Install Button Styling */
        #install-btn {
            display: none;
            position: absolute;
            top: 20px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(255, 255, 255, 0.2);
            z-index: 10;
        }

        #install-btn:hover {
            background-color: #e0e0e0;
        }

        /* Thick White Border & Black Background Container */
        .player-container {
            width: 90%;
            max-width: 900px;
            border: 8px solid #ffffff;
            box-sizing: border-box;
            background-color: #000000;
        }

        iframe {
            width: 100%;
            height: 500px;
            display: block;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Install App Button -->
    <button id="install-btn">Install App</button>

    <div class="player-container">
        <iframe src="https://cdn.abplive.com/LiveStreams/260118/abpananda/streaming_bengali_vidgyor-new-nov2022.html" allow="autoplay;" allowfullscreen></iframe>
    </div>

    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("Service Worker Registered"))
                .catch((err) => console.log("Service Worker Failed", err));
        }

        // Handle Installation Prompt
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block'; // Show the button when installable

            installBtn.addEventListener('click', () => {
                installBtn.style.display = 'none';
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                    }
                    deferredPrompt = null;
                });
            });
        });
    </script>

</body>
</html>
